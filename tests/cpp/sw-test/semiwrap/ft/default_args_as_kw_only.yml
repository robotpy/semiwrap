defaults:
  default_args_as_kw_only: true
functions:
  defaultArgsKwOnly:
  defaultArgsPositionalOptOut:
    default_args_as_kw_only: false
  noDefaultThenKwOnly:
    param_override:
      positional:
        no_default: true
  overloadKwOnlyOptOut:
    overloads:
      int, int:
        default_args_as_kw_only: false
      const char*, const char*:
  overloadKwOnlyOptIn:
    default_args_as_kw_only: false
    overloads:
      int, int:
      const char*, const char*:
        default_args_as_kw_only: true
classes:
  DefaultArgsMethod:
    methods:
      calculate:
      calculatePositional:
        default_args_as_kw_only: false
