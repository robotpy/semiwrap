classes:
  cr::inner::ProtectedUsing:
    methods:
      ProtectedUsing:
        overloads:
          "":
          CantResolve:
  u::FwdDecl:
    attributes:
      x:
functions:
  fn_using:
    overloads:
      AlsoCantResolve:
      std::string:

inline_code_namespace: cr::inner
inline_code: |
  m.def("explicit_inline_code_namespace", []() {
    return std::is_same_v<CantResolve, AlsoCantResolve>;
  });
