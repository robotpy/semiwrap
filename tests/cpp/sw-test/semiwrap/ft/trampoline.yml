inline_code: |
  cls_ClassWithTrampoline
    .def("get42", [](ClassWithTrampoline_Trampoline * self) { return self->get42(); })
  ;
  [this]() {
    cls_ClassWithTrampoline
      .def("get43", [](ClassWithTrampoline_Trampoline * self) { return self->get42() + 1; })
    ;
